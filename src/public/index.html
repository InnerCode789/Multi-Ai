<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchitectArena Hybrid | AI Debate Engine</title>
    <!-- Syntax Highlighting Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/monokai-sublime.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>🥊 ArchitectArena</h1>
            <p class="subtitle">Tri-Mode AI Architecture Debate Engine</p>
        </div>
        <div id="connection-status" class="status-indicator">
            <span class="dot"></span> <span class="status-text">Ready</span>
        </div>
    </header>

    <main>
        <section class="input-panel">
            <div class="input-header">
                <h2>Debate Topic / Code snippet</h2>
                <div class="language-select">
                    <select id="language-dropdown">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="typescript">TypeScript</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="ruby">Ruby</option>
                        <option value="php">PHP</option>
                    </select>
                </div>
            </div>
            
            <textarea id="code-input" placeholder="Paste your architecture design, code snippet, or technical dilemma here..."></textarea>
            
            <div class="controls">
                <div class="mode-selector">
                    <label class="mode-chip">
                        <input type="radio" name="mode" value="cloud" checked>
                        <span class="chip-text">⚡ Cloud APIs</span>
                    </label>
                    <label class="mode-chip">
                        <input type="radio" name="mode" value="local">
                        <span class="chip-text">💻 Local Ollama</span>
                    </label>
                    <label class="mode-chip">
                        <input type="radio" name="mode" value="scraper">
                        <span class="chip-text">🕷️ Web Scraper</span>
                    </label>
                    <label class="mode-chip">
                        <input type="radio" name="mode" value="auto">
                        <span class="chip-text">🔄 Auto</span>
                    </label>
                </div>
                
                <button id="start-btn" class="neon-btn">🥊 START DEBATE</button>
            </div>
        </section>

        <section class="arena-panel">
            <div class="agent-column agent-purist" id="agent1-col">
                <div class="agent-header">
                    <span class="icon">⚡</span>
                    <h3>Performance Purist</h3>
                </div>
                <div class="output-container" id="agent1-output">
                    <div class="placeholder-text">Waiting for debate to start...</div>
                </div>
                <div class="typing-indicator" id="agent1-typing">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>

            <div class="agent-column agent-security" id="agent2-col">
                <div class="agent-header">
                    <span class="icon">🛡️</span>
                    <h3>Security Auditor</h3>
                </div>
                <div class="output-container" id="agent2-output">
                    <div class="placeholder-text">Waiting for debate to start...</div>
                </div>
                <div class="typing-indicator" id="agent2-typing">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>

            <div class="agent-column agent-architect" id="agent3-col">
                <div class="agent-header">
                    <span class="icon">👨‍⚖️</span>
                    <h3>Chief Architect</h3>
                </div>
                <div class="output-container" id="agent3-output">
                    <div class="placeholder-text">Waiting for debate to start...</div>
                </div>
                <div class="typing-indicator" id="agent3-typing">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="status-bar">
        <div class="status-item mode-info">Mode: <span id="active-mode">⚡ Cloud APIs</span></div>
        <div class="status-item round-info">Round: <span id="round-progress">0 / 3</span></div>
        <div class="status-item failover-alert" id="failover-notice" style="display: none;"></div>
    </footer>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
