<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchitectArena Hybrid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>🏛️ ArchitectArena</h1>
            <span class="subtitle">AI Design Debate System</span>
        </div>
        <div class="connection-status">
            <span id="status-indicator" class="indicator disconnected"></span>
            <span id="status-text">Disconnected</span>
        </div>
    </header>

    <main class="container">
        <section class="input-panel">
            <h2>System Design Challenge</h2>
            <textarea id="code-input" placeholder="Describe the system requirements or paste existing architecture code..." spellcheck="false"></textarea>
            
            <div class="controls">
                <div class="control-group">
                    <label for="language-select">Language/Context:</label>
                    <select id="language-select">
                        <option value="javascript">Node.js / JS</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="go">Go</option>
                        <option value="architecture" selected>System Architecture</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="mode-select">Execution Mode:</label>
                    <select id="mode-select">
                        <option value="cloud">⚡ Free Cloud APIs (Fast)</option>
                        <option value="local">💻 Local Ollama</option>
                        <option value="scraper">🕷️ Stealth Web Scraper (DeepSeek/ChatGPT)</option>
                        <option value="hybrid">🔀 Auto-Fallback Hybrid</option>
                    </select>
                </div>

                <button id="start-btn" class="primary-btn">
                    <span class="btn-text">Start Debate</span>
                    <span class="btn-icon">▶</span>
                </button>
            </div>
        </section>

        <section class="arena-panel">
            <div class="debate-columns">
                <div class="agent-card">
                    <div class="agent-header">
                        <h3>⚡ Performance Purist</h3>
                    </div>
                    <div id="agent1-output" class="agent-output"></div>
                    <div id="agent1-typing" class="typing-indicator hidden">
                        <span></span><span></span><span></span>
                    </div>
                </div>

                <div class="agent-card">
                    <div class="agent-header">
                        <h3>🛡️ Security Auditor</h3>
                    </div>
                    <div id="agent2-output" class="agent-output"></div>
                    <div id="agent2-typing" class="typing-indicator hidden">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>

            <div class="verdict-section">
                <div class="agent-card final-verdict-card">
                    <div class="agent-header">
                        <h3>👨⚖️ Chief Architect — Final Verdict</h3>
                        <button id="copy-btn" class="copy-btn" style="display:none;">📋 Copy Final Code</button>
                    </div>
                    <div id="agent3-output" class="agent-output"></div>
                    <div id="agent3-typing" class="typing-indicator hidden">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="status-bar">
        <span id="footer-status">Ready. Select mode and enter prompt.</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
